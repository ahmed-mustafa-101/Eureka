name: eureka
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  cached_network_image: ^4.0.5
  equatable: ^3.0.0
  flutter_bloc: ^9.1.1
  flutter_screenutil_plus: ^2.0.0
  flutter_svg: ^2.3.0
  get_it: ^9.3.0
  go_router: ^18.1.1
  intl: ^0.20.3
  gap: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  
